name: Frontend CI

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - "taskforce-frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "taskforce-frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taskforce-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: taskforce-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:ci

      - name: Build production bundle
        env:
          CI: "true"
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: taskforce-frontend/build

